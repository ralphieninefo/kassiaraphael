    <!-- WELCOME (cream). Every section below: 12-column grid, label + heading left, content right. -->
    <section class="sheet paper" id="welcome">
      <div class="grid welcome reveal">
        <header class="head">
          <p class="label"><span class="num">I</span><span data-t="welcome_label"></span></p>
          <h2 data-t="welcome_title"></h2>
        </header>
        <div class="main">
          <p class="lede" data-t="welcome_text"></p>
        </div>
      </div>
    </section>

    <!-- OUR STORY (albano) -->
    <section class="sheet albano" id="story">
      <div class="grid story reveal">
        <header class="head">
          <p class="label"><span class="num">II</span><span data-t="story_label"></span></p>
          <h2 data-t="story_title"></h2>
        </header>
        <figure class="side shot story-shot">
          <div class="print"><img src="/images/story-graduation.jpg" width="768" height="960" loading="lazy" data-t-alt="story_photo_alt" alt=""></div>

        </figure>
        <div class="main">
          <p data-t="story_p1"></p>
          <p data-t="story_p2"></p>
          <p data-t="story_p3"></p>
          <p data-t="story_p4"></p>
        </div>
      </div>
    </section>

    <!-- WHY ITALY + VENUE (cream) -->

      <div class="italy reveal">
        <p class="label"><span class="num">III</span><span data-t="italy_label"></span></p>
        <p class="italy-text" data-t="italy_text"></p>
      </div>

      <hr class="rule">

      <div class="grid venue reveal">
        <header class="head">
          <p class="label"><span class="num">IV</span><span data-t="venue_label"></span></p>
          <h2 data-t="venue_title"></h2>
        </header>
        <p class="main copy" data-t="venue_text"></p>
        <!-- Row 2: three frames with level tops and bottoms. The place in colour, people in black and white. -->
        <figure class="side plate drawing">
          <div class="frame"><img src="/images/villa-line-drawing-ink.svg" width="1972" height="865" loading="lazy" data-t-alt="venue_img_alt" alt=""></div>
          <figcaption data-t="venue_img_caption"></figcaption>
        </figure>
        <div class="pair">
          <figure class="plate framed">
            <div class="frame"><img src="/images/venue-tower.jpg" width="1000" height="1250" loading="lazy" data-t-alt="tower_alt" alt=""></div>

          </figure>
          <figure class="plate framed">
            <div class="frame"><img src="/images/venue-aerial.jpg" width="1000" height="1250" loading="lazy" data-t-alt="aerial_alt" alt=""></div>

          </figure>
          <p class="aside rest" data-t="venue_rest"></p>
        </div>
      </div>

        <p class="motto" lang="la" data-t="footer_motto"></p>
        <p class="gloss" data-t="footer_translation"></p>
      </div>
    </section>

            <div><p class="when" data-t="fri_time"></p><p data-t="fri_text"></p></div>

          <li><p class="caps" data-t="sat_day"></p><div><p data-t="sat_text"></p></div></li>

        </div>

          <p class="label"><span class="num">VII</span><span data-t="stay_label"></span></p>

        </header>
        <div class="main">
          <p data-t="stay_text"></p>
        </div>
      </div>

      <div class="grid reveal" id="questions">

          <p class="label"><span class="num">VIII</span><span data-t="questions_label"></span></p>
          <h2 data-t="questions_title"></h2>

    <!-- LORE (albano): the last section, after Questions. Not in the nav; linked from the Venue, below Questions and from the footer. -->
    <section class="sheet albano lore" id="lore">
      <div class="grid reveal">
        <header class="head">
          <p class="label"><span class="num">IX</span><span data-t="lore_label"></span></p>
          <h2 data-t="lore_title"></h2>
        </header>
        <p class="main lede" data-t="lore_standfirst"></p>
      </div>

      <figure class="plate lore-plate reveal">
        <div class="frame"><img src="/images/lore-lake-1440.jpg" srcset="/images/lore-lake-1440.jpg 1440w, /images/lore-lake-2880.jpg 2880w" sizes="(min-width: 1024px) 1100px, 92vw" width="1440" height="586" loading="lazy" data-t-alt="lake_img_alt" alt=""></div>
        <figcaption data-t="lake_img_caption"></figcaption>
      </figure>

      <hr class="rule">

      <!-- Chapters: kicker + title on the left, an optional margin item on the right, then the text in two columns
           (7-12 starts at the same x as every other section). Margin items follow the text in the DOM, so on phones they come after it. -->
      <article class="grid chapter reveal">
        <header class="head">
          <p class="caps kicker" data-t="lore_one"></p>
          <h3 data-t="lore_c1_title"></h3>
        </header>
        <div class="main">
          <p data-t="lore_c1_p1"></p>
          <p data-t="lore_c1_p2"></p>
          <p data-t="lore_c1_p3"></p>
        </div>
        <blockquote class="margin pull"><p data-t="lore_pull"></p></blockquote>
      </article>

      <hr class="rule">

      <article class="grid chapter reveal">
        <header class="head">
          <p class="caps kicker" data-t="lore_two"></p>
          <h3 data-t="lore_c2_title"></h3>
        </header>
        <div class="main">
          <p data-t="lore_c2_p1"></p>
          <p data-t="lore_c2_p2"></p>
          <p data-t="lore_c2_p3"></p>
          <p data-t="lore_c2_p4"></p>
        </div>
      </article>

      <hr class="rule">

      <article class="grid chapter chapter--aside reveal">
        <header class="head">
          <p class="caps kicker" data-t="lore_three"></p>
          <h3 data-t="lore_c3_title"></h3>
        </header>
        <div class="main">
          <p data-t="lore_c3_p1"></p>
          <p data-t="lore_c3_p2"></p>
        </div>
        <aside class="margin note">
          <p class="caps" data-t="lore_note_label"></p>
          <p data-t="lore_note_text"></p>
        </aside>
      </article>

      <hr class="rule">

      <div class="reading reveal">
        <p class="caps reading-label" data-t="reading_label"></p>
        <div class="reading-list">
          <article>
            <h3 data-t="reading1_title"></h3>
            <p class="caps by" data-t="reading1_by"></p>
            <p data-t="reading1_text"></p>
          </article>
          <article>
            <h3 data-t="reading2_title"></h3>
            <p class="caps by" data-t="reading2_by"></p>
            <p data-t="reading2_text"></p>
          </article>
        </div>
      </div>
    </section>

      </div>
      <div class="signoff">
