<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Private site: keep out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Kassia &amp; Raphaël</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#7A1F10">
  <link rel="preload" href="/fonts/neuton-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/pinyon-script-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script>document.documentElement.className = "js";</script>
</head>
<body>
  <a class="skip" href="#main" data-t="skip_link"></a>

  <header class="topbar">
    <nav class="nav" data-t-aria="nav_label">
      <a href="#venue" data-t="nav_venue"></a>
      <a href="#weekend" data-t="nav_weekend"></a>
      <a href="#travel" data-t="nav_travel"></a>
      <a href="#stay" data-t="nav_stay"></a>
      <a href="#questions" data-t="nav_questions"></a>
    </nav>
    <div class="lang" role="group" data-t-aria="lang_label">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <span aria-hidden="true">|</span>
      <button type="button" data-lang="fr" aria-pressed="false" lang="fr">FR</button>
    </div>
  </header>

  <noscript><p class="noscript">This page needs JavaScript to show its text. · Cette page a besoin de JavaScript pour afficher son texte. · raphaelkassia2027@gmail.com</p></noscript>

  <main id="main">
    <!-- HERO (brick) -->
    <section class="sheet brick hero">
      <h1 class="names">Kassia <span class="amp">&amp;</span> Raphaël</h1>
      <figure class="print reveal">
        <img src="/images/hero-bw.jpg" width="1600" height="998" data-t-alt="hero_photo_alt" alt="">
      </figure>
      <div class="caption">
        <p class="caps date" data-t="hero_date"></p>
        <p class="place" data-t="hero_place"></p>
        <p class="caps quiet" data-t="hero_note"></p>
      </div>
    </section>

    <!-- WELCOME + VENUE (travertine) -->
    <section class="sheet paper" id="venue" style="--marker: var(--lake)">
      <div class="block reveal">
        <p class="label" data-t="welcome_label"></p>
        <p class="lede" data-t="welcome_text"></p>
      </div>

      <div class="divider" aria-hidden="true">
        <img src="/images/villa-line-drawing.svg" width="2000" height="893" alt="">
      </div>

      <div class="block reveal">
        <p class="label" data-t="venue_label"></p>
        <h2 data-t="venue_title"></h2>
        <figure class="plate">
          <!-- TODO: replace placeholder with a real photo of the villa (same path). -->
          <img src="/images/villa-1.jpg" width="1600" height="1067" loading="lazy" data-t-alt="venue_img_alt" alt="">
          <figcaption data-t="venue_img_caption"></figcaption>
        </figure>
        <p data-t="venue_text"></p>
        <p class="aside" data-t="venue_aside"></p>
      </div>
    </section>

    <!-- WEEKEND (brick) -->
    <section class="sheet brick" id="weekend" style="--marker: var(--marigold)">
      <div class="block reveal">
        <p class="label" data-t="weekend_label"></p>
        <p class="aside" data-t="weekend_note"></p>
        <ol class="days">
          <li><p class="caps" data-t="thu_day"></p><p data-t="thu_text"></p></li>
          <li class="main"><p class="caps" data-t="fri_day"></p><p data-t="fri_text"></p></li>
          <li><p class="caps" data-t="sat_day"></p><p data-t="sat_text"></p></li>
          <li><p class="caps" data-t="sun_day"></p><p data-t="sun_text"></p></li>
        </ol>
      </div>
      <figure class="print print--small reveal">
        <img src="/images/couple-2.jpg" width="1000" height="1016" loading="lazy" data-t-alt="couple_2_alt" alt="">
      </figure>
    </section>

    <!-- GETTING THERE + WHERE TO STAY (travertine) -->
    <section class="sheet paper" id="travel" style="--marker: var(--terracotta)">
      <div class="block reveal">
        <h2 data-t="travel_label"></h2>
        <figure class="plate">
          <!-- TODO: replace placeholder with a real photo of Lake Albano (same path). -->
          <img src="/images/lake-1.jpg" width="1600" height="900" loading="lazy" data-t-alt="lake_img_alt" alt="">
          <figcaption data-t="lake_img_caption"></figcaption>
        </figure>
        <p data-t="travel_1"></p>
        <!-- TODO verify before launch: train route, station name and times on Trenitalia. -->
        <p data-t="travel_2"></p>
        <p data-t="travel_3"></p>
      </div>
      <hr class="rule">
      <div class="block reveal" id="stay">
        <h2 data-t="stay_label"></h2>
        <p data-t="stay_text"></p>
      </div>
    </section>

    <!-- DRESS + QUESTIONS (travertine) -->
    <section class="sheet paper" id="questions" style="--marker: var(--terracotta)">
      <div class="block reveal">
        <h2 data-t="dress_label"></h2>
        <p data-t="dress_text"></p>
      </div>
      <hr class="rule">
      <div class="block reveal">
        <h2 data-t="questions_label"></h2>
        <p data-t="questions_text"></p>
        <p><a class="email" data-t="email" data-t-mailto="email"></a></p>
      </div>
    </section>
  </main>

  <!-- FOOTER (brick) -->
  <footer class="sheet brick footer">
    <p class="motto" lang="la" data-t="footer_motto"></p>
    <p class="gloss" data-t="footer_translation"></p>
    <p class="caps quiet" data-t="footer_names"></p>
  </footer>

  <script src="/content.js"></script>
  <script src="/script.js"></script>
</body>
</html>
