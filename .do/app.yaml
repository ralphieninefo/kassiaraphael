# DigitalOcean App Platform spec — static site, no build step.
# Deploys `main` on every push. DNS for the domains below is managed in the
# App Platform dashboard (Settings > Domains) or at your registrar.
name: kassiaraphael
static_sites:
  - name: wedding-site
    github:
      repo: ralphieninefo/kassiaraphael
      branch: main
      deploy_on_push: true
    source_dir: /
    index_document: index.html
    # Any unknown path (e.g. /fr) serves index.html with a 200; script.js picks the language.
    catchall_document: index.html
domains:
  - domain: kassiaraphael.com
    type: PRIMARY
  - domain: www.kassiaraphael.com
    type: ALIAS
